<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>
</body>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react?dev",
    "react-dom/client": "https://esm.sh/react-dom/client?dev"
  }
}
</script>
<script type="text/babel" data-type="module">
    import React, { StrictMode } from 'react';
    import { createRoot } from 'react-dom/client';

    import { useState } from 'react';

    const App = function app() {
      /*
        Exercise:
          Create an Image component
          This will display an image
          Create a ChangeImage button
          Everytime the button is clicked, the image changes
          The images will cycle through 3 predetermined images
      */






      // [variable, functionToChangeVariable] = useState(initial value of variable)
      const [count, incrementCount] = useState(0);
      // in vanilla JS
      // let count = 0
      // function incrementCount() { count += 1; } // This is not a good idea!

      // function incrementCount() { setCount(count + 1); } // This is a good idea!

      function buttonClick() {
        incrementCount(count + 1);
      }

      function decrementCount() {
        incrementCount(count - 1);
      }

      const paragraphs = [];
      for (let i=0; i<10; i++) {
        paragraphs.push(<Paragraph key={i} paragraphNum={i} />);
      }

      const dataMusicArray = [
        // song, artist, rating
        { song: "Never Gonna Give You Up",
          artist: "Rick Astley",
          rating: 5
        },
        { song: "Billie Jean", artist: "Michael Jackson", rating: 5 },
        { song: "Come and Get Your Love", artist: "Red Bone", rating: 4 },
        { song: "Stuck in the Middle With You", artist: "I don't know", rating: 3 }
      ]

      const musicComponents = [];
      // for (let i=0; i<dataMusicArray.length; i++)

      dataMusicArray.forEach(songSelection => {
        musicComponents.push(<DataMusic Music={songSelection}/>);
      })

      return (
        <div>
          <h1>Welcome to the website!</h1>
          <p>Hope you enjoy it.</p>
          <CountButton count_component={count} buttonClick_component={buttonClick}/>
          <Paragraph paragraphNum={"a"} />
          <Paragraph paragraphNum={"b"}/>
          <Paragraph paragraphNum={11}/>
          // Mistake in buttonClick on purpose
          <CountButton count_component={count} buttonClick_component={decrementCount}/>
          {musicComponents}
          {paragraphs}
        </div>
      )
    }


    function Paragraph({paragraphNum}) {
      return(
        <p>This is a paragraph! This is paragraph number: {paragraphNum}</p>
      )
    }

    function CountButton( {count_component, buttonClick_component} ) {
      return(
        <button onClick={buttonClick_component}>Clicked {count_component} times!</button>
      )
    }

    function DataMusic( {Music} ) {
      return(
        <ul>
          <li>Song: {Music.song}</li>
          <li>Artist: {Music.artist}</li>
          <li>Rating: {Music.rating}/5</li>
        </ul>
      )
    }





    const root = createRoot(document.getElementById("root"));
    root.render(
      <App/>
    )
</script>
</html>
