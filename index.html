<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>
</body>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react?dev",
    "react-dom/client": "https://esm.sh/react-dom/client?dev"
  }
}
</script>
<script type="text/babel" data-type="module">
    import React, { StrictMode } from 'react';
    import { createRoot } from 'react-dom/client';

    import { useState } from 'react';

    const App = function app() {
      // [variable, functionToChangeVariable] = useState(initial value of variable)
      const [count, incrementCount] = useState(0);
      // in vanilla JS
      // let count = 0
      // function incrementCount() { count += 1; } // This is not a good idea!

      // function incrementCount() { setCount(count + 1); } // This is a good idea!

      function buttonClick() {
        incrementCount(count + 1);
      }

      const paragraphs = [];
      for (let i=0; i<10; i++) {
        paragraphs.push(<Paragraph key={i} />);
      }

      return (
        <div>
          <h1>Welcome to the website!</h1>
          <p>Hope you enjoy it.</p>
          <CountButton count_component={count} buttonClick_component={buttonClick}/>
          <Paragraph key={"a"} />
          <Paragraph key={"b"}/>
          <Paragraph key={11}/>
          // Mistake in buttonClick on purpose
          <CountButton count_component={count} buttonClick={buttonClick}/>
          {paragraphs}
        </div>
      )
    }


    function Paragraph({key}) {
      return(
        <p>This is a paragraph! This is paragraph number: {key}</p>
      )
    }

    function CountButton( {count_component, buttonClick_component} ) {
      return(
        <button onClick={buttonClick_component}>Clicked {count_component} times!</button>
      )
    }

    const root = createRoot(document.getElementById("root"));
    root.render(
      <App/>
    )
</script>
</html>
